name: Pull-request checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The GitHub Action requires a GITLEAKS_LICENSE for organization-owned
      # repositories. Install the MIT-licensed CLI directly so forked pull
      # requests can run the blocking secret scan without that secret.
      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar --extract --gzip --file=- --directory=/usr/local/bin gitleaks
      - name: Run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gitleaks detect --source . --log-opts "${BASE_SHA}..${HEAD_SHA}" --verbose
  backend:
    name: Backend tooling
    # Python 3.13.11 is published for Ubuntu 24.04, but not Ubuntu 26.04.
    # Keep this runner pinned while backend/.python-version remains exact.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: medcheck_test
          POSTGRES_USER: medcheck
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medcheck -d medcheck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Run application tests with PostgreSQL and coverage
        run: uv run pytest --cov=accounts --cov=medications --cov-report=xml
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: postgresql://medcheck:ci-only-password@localhost:5432/medcheck_test
      - name: Scan Python application code
        run: uv run bandit --quiet --recursive accounts medications config
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Run infrastructure tests with coverage
        run: pnpm test
      - name: Build web application
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run landing-page browser tests
        run: pnpm test:e2e
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
