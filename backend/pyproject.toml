[project]
name = "medcheck-backend"
version = "0.0.0"
description = "Infrastructure-only backend tooling for Medcheck."
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "pyright>=1.1,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["tests"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
include = ["tests"]
typeCheckingMode = "basic"
